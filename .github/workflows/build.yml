name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore KeyBox-Windows.sln

      # W1 核心交付物：加密向量 + 登录/会话契约测试（纯托管，无需 WinUI 环境）
      - name: Test (KeyBox.Core)
        run: dotnet test tests/KeyBox.Core.Tests/KeyBox.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Build (full solution, x64)
        run: dotnet build KeyBox-Windows.sln -c Release --no-restore -p:Platform=x64

      # W5 再做 MSIX 打包；本批以 test + build 为准。
