# ─────────────────────────────────────────────────────────────────────────────
# build-android.yml —— 云端构建 Android APK（Capacitor 外壳，架构 §10 第 9 步）
#
# 触发：手动（Actions → Run workflow）或推送 v* 标签。
# 产物：Artifact `keybox-android-apk`（已签名则为 app-release.apk，否则 app-debug.apk）。
#
# ⚠️ 签名相关的一切【只从 GitHub Secrets 读取】——本文件只出现 ${{ secrets.XXX }} 占位，
#    仓库内不存任何 keystore 或口令。请在 GitHub 仓库 →
#    Settings → Secrets and variables → Actions 配置以下 4 个 secret：
#
#      ANDROID_KEYSTORE_BASE64    keystore 文件的 base64（单行文本）
#                                 Linux/macOS 生成：base64 -w0 keybox-release.keystore
#                                 Windows 生成：certutil -encode keybox-release.keystore ks.txt
#                                               （再手工去掉首行 -----BEGIN... 与末行 -----END...，拼成单行）
#      ANDROID_KEYSTORE_PASSWORD  keystore 口令
#      ANDROID_KEY_ALIAS          密钥别名
#      ANDROID_KEY_PASSWORD       该别名的口令
#
#    未配置这 4 个 secret 时（例如 fork/PR），本次会退化为构建【未签名】debug APK，
#    仅供联调，**不可用于正式分发**（工作流会打印 warning）。
#
# 前置：JDK 与 Android SDK 由下方官方 action 安装；本机无需任何工具链。
# 参考：Capacitor 官方 Building/Signing 指南 https://capacitorjs.com/docs/android
# ─────────────────────────────────────────────────────────────────────────────
name: build-android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # ⚠️ npm 已知 bug #4828：lockfile 在 Windows 上生成时，npm ci 可能跳过
        #    Linux 平台的可选依赖（rollup/esbuild 的原生二进制），导致构建报
        #    Cannot find module '@rollup/rollup-linux-x64-gnu'。此处显式补装，
        #    版本与 package-lock 中的 rollup 4.63.5 / esbuild 0.21.5 严格对应。
        run: |
          npm ci
          npm i --no-save @rollup/rollup-linux-x64-gnu@4.63.5 @esbuild/linux-x64@0.21.5

      - name: Test
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        # ⚠️ 已停用：android-actions/setup-android@v3 的 sdkmanager 在 runner 上偶发
        #    exit code 1（已实测失败一次）。ubuntu-latest 镜像自带 Android SDK
        #    （ANDROID_HOME 已指向预装目录），此步本就多余；许可证改在下方
        #    Build APK 步骤里统一接受。
        if: false
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare signing (optional, from secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keybox-release.keystore
            printf 'storeFile=keybox-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > android/key.properties
            echo "GRADLE_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_GLOB=android/app/build/outputs/apk/release/*.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置签名 secrets，退化为未签名 debug APK（不可正式分发）"
            echo "GRADLE_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_GLOB=android/app/build/outputs/apk/debug/*.apk" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x android/gradlew
          cd android
          ./gradlew "$GRADLE_TASK" --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keybox-android-apk
          path: ${{ env.APK_GLOB }}
          if-no-files-found: error
