name: web

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: web (vitest + vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (云函数契约 / 加密向量 / 上限用例)
        run: npx vitest run

      - name: Build (vite)
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: keybox-web-dist
          path: web/dist
          if-no-files-found: error