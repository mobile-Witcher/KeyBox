<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="KeyBox —— 20 人以内团队的本地加密密钥保管箱，云端只存密文。"
    />
    <title>KeyBox</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      /*
       * 首屏外观（R24 + 皮肤系统）：在任何 CSS / 渲染之前定好「明暗 + 皮肤」，消除白闪（FOUC）。
       * ⚠️ 三处必须一致（改一处要同改另外两处）：
       *   1) 本脚本的 BG 表          2) src/index.css 各皮肤块的 --kb-bg
       *   3) src/lib/theme.ts 的 SKIN_BG
       * 存储键：keybox.theme = "light"|"dark"；keybox.skin = default|tech|minimal|paper
       * 该脚本必须保持极小且同步，不可改成模块或延后执行。
       */
      (function () {
        try {
          var BG = {
            endfield: { light: "#ede6d6", dark: "#0e0f0f" },
            rhine: { light: "#f4f6f4", dark: "#0b1012" },
            arknights: { light: "#f7f7f5", dark: "#08090a" },
            atlas: { light: "#edf1ee", dark: "#0b0f12" }
          };
          var ls = null;
          try {
            ls = window.localStorage;
          } catch (e) {
            ls = null;
          }
          /* URL 预览参数（?skin=endfield&theme=dark）：演示/截图用，优先于存储 */
          var q = null;
          try {
            q = new URLSearchParams(window.location.search);
          } catch (e) {
            q = null;
          }
          var qTheme = q ? q.get("theme") : null;
          var qSkin = q ? q.get("skin") : null;
          var storedTheme =
            qTheme === "light" || qTheme === "dark" || qTheme === "system"
              ? qTheme
              : ls
              ? ls.getItem("keybox.theme")
              : null;
          /* "system"（或未设置）时跟随浏览器/系统深浅 */
          var isDark =
            storedTheme === "dark" ||
            (storedTheme !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var storedSkin = qSkin && BG[qSkin] ? qSkin : ls ? ls.getItem("keybox.skin") : null;
          var skin = storedSkin && BG[storedSkin] ? storedSkin : "endfield";
          var root = document.documentElement;
          if (isDark) root.classList.add("dark");
          root.setAttribute("data-skin", skin);
          root.style.colorScheme = isDark ? "dark" : "light";
          root.style.backgroundColor = BG[skin][isDark ? "dark" : "light"];
        } catch (e) {
          /* 任何异常都退化为默认外观，不阻断渲染 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
