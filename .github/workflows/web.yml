name: web

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: web (vitest + vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # package-lock.json 在 Windows 上生成，无论 npm ci 还是 npm install 都会照 lock 解析，
        # 永远补不上 Linux 平台专属可选依赖（npm/cli#4828：Cannot find module @rollup/rollup-linux-x64-gnu）。
        # 因此在 CI 里就地丢弃 lock 后重新解析；仓库内的 lock 文件保持不动。
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Unit tests (云函数契约 / 加密向量 / 上限用例)
        run: npx vitest run

      - name: Build (vite)
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: keybox-web-dist
          path: web/dist
          if-no-files-found: error