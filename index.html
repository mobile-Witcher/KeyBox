<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KeyBox —— 20 人以内团队的本地加密密钥保管箱，云端只存密文。"
    />
    <title>KeyBox</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      /*
       * 首屏外观（R24 + 皮肤系统）：在任何 CSS / 渲染之前定好「明暗 + 皮肤」，消除白闪（FOUC）。
       * ⚠️ 三处必须一致（改一处要同改另外两处）：
       *   1) 本脚本的 BG 表          2) src/index.css 各皮肤块的 --kb-bg
       *   3) src/lib/theme.ts 的 SKIN_BG
       * 存储键：keybox.theme = "light"|"dark"；keybox.skin = default|tech|minimal|paper
       * 该脚本必须保持极小且同步，不可改成模块或延后执行。
       */
      (function () {
        try {
          var BG = {
            default: { light: "#f8fafc", dark: "#0b1120" },
            tech: { light: "#eef2fb", dark: "#070b16" },
            minimal: { light: "#ffffff", dark: "#0a0a0a" },
            paper: { light: "#f4efe4", dark: "#1c1710" },
            cyber: { light: "#f7f0fb", dark: "#07020f" },
            kawaii: { light: "#fff5f9", dark: "#2a1a24" },
            hacker: { light: "#f2f5f0", dark: "#000000" },
            solar: { light: "#f4f0e6", dark: "#1e2318" },
            sunset: { light: "#fff4ec", dark: "#1d1119" }
          };
          var ls = null;
          try {
            ls = window.localStorage;
          } catch (e) {
            ls = null;
          }
          var storedTheme = ls ? ls.getItem("keybox.theme") : null;
          var isDark =
            storedTheme === "dark" ||
            (storedTheme !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var storedSkin = ls ? ls.getItem("keybox.skin") : null;
          var skin = storedSkin && BG[storedSkin] ? storedSkin : "default";
          var root = document.documentElement;
          if (isDark) root.classList.add("dark");
          root.setAttribute("data-skin", skin);
          root.style.colorScheme = isDark ? "dark" : "light";
          root.style.backgroundColor = BG[skin][isDark ? "dark" : "light"];
        } catch (e) {
          /* 任何异常都退化为默认外观，不阻断渲染 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
